# cronkit 发版流水线。这是唯一被允许调用 relkit-agent 的地方。
#
#   git tag beta/v0.1.0+2   && git push origin beta/v0.1.0+2    → RUP channel=beta
#   git tag stable/v0.1.0+2 && git push origin stable/v0.1.0+2  → RUP channel=stable
#
# tag 只是触发器，版本号的唯一来源是 VERSION.json（用 `relkit version set|bump` 改）。
# 两者不一致时流水线直接失败，避免 tag 与产物里的版本各说各话。
#
# 密钥来自 shichao402/keystores 的 relkit_release.env.yml：
#   RELKIT_PUBLISH_TOKEN  发布 agent 的 Bearer。CI 只有它，没有签名私钥 —— 私钥在发布机上
#                         按产品分文件存放，任何构建节点都不该能读到。
#   RELKIT_PUBLISH_URL    默认 https://publish.firoyang.com（走 nginx 公网入口，不走 127.0.0.1）
#
# 已知缺口：该 token 目前是所有产品共用的一把长期 Bearer，拿到它就能发布任意产品；agent
# 也不校验产物出处，所以它拦不住"拿着 token 从别处上传"。收敛方向是按产品签发 + 短时效 +
# 出处校验，见元仓库 .cursor/rules/release-integrity.mdc。
#
# 构建节点：CNB 官方节点只有 Linux Docker，Windows 产物靠 electron-builder + wine 交叉构建。
# 若以后接入自托管 Windows runner，把 docker 段换成 runner.{namespace,tags} 即可，
# 构建脚本本身已是跨平台的（Go 显式 GOOS=windows，zip 由 yazl 生成）。

.toolchain-script: &toolchain-script |
  set -euo pipefail
  node -v
  # Go 用来交叉编译 launcher 与 relkit-apply sidecar，并构建 relkit CLI 做 stage。
  curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
  rm -rf /usr/local/go
  tar -C /usr/local -xzf /tmp/go.tgz
  # 每个 stage 是独立 shell，export PATH 不跨 stage 保留，所以落成软链。
  ln -sf /usr/local/go/bin/go /usr/local/bin/go
  go version

.deps-script: &deps-script |
  set -euo pipefail
  # rup-client 是 relkit 仓库的子目录，先按固定点检出到 third_party 才能装依赖。
  # npm 的 preinstall 也会调它（已在固定点时秒退），这里显式跑一次是为了日志可读。
  node scripts/ensure-relkit.mjs
  npm ci

.checks-script: &checks-script |
  set -euo pipefail
  npm run check-version
  npx tsc --noEmit
  npm test

.build-script: &build-script |
  set -euo pipefail
  npm run dist
  ls -l dist/

.release: &release
  name: release
  docker:
    image: electronuserland/builder:wine
  imports:
    - https://cnb.cool/shichao402/keystores/-/blob/main/relkit_release.env.yml
  env:
    GO_VERSION: "1.26.3"
  stages:
    - name: resolve-version
      script: |
        set -euo pipefail
        TAG="${CNB_BRANCH:-}"
        case "$TAG" in
          beta/v*)   CHANNEL=beta;   VERSION="${TAG#beta/v}" ;;
          stable/v*) CHANNEL=stable; VERSION="${TAG#stable/v}" ;;
          *) echo "只接受 beta/vX.Y.Z+N 或 stable/vX.Y.Z+N 形式的 tag，收到：$TAG"; exit 1 ;;
        esac

        # codeStrategy=version-build：`+` 后面那个整数就是客户端比较用的 code，必须单调递增。
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
          echo "无效版本号：$VERSION（期望 x.y.z+build）"
          exit 1
        fi

        FILE_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).version)")
        if [ "$FILE_VER" != "$VERSION" ]; then
          echo "VERSION.json（$FILE_VER）与 tag 版本（$VERSION）不一致"
          exit 1
        fi

        echo "$VERSION" > .release-version
        echo "$CHANNEL" > .release-channel
        echo "version=$VERSION channel=$CHANNEL tag=$TAG commit=$(git rev-parse HEAD)"

    - name: toolchain
      script: *toolchain-script
    - name: deps
      script: *deps-script
    - name: checks
      script: *checks-script
    - name: build
      script: *build-script

    - name: stage
      script: |
        set -euo pipefail
        VERSION=$(cat .release-version)
        CHANNEL=$(cat .release-channel)
        # stage 不联网、不碰密钥，产出的 staged.pb 只有哈希与版本，没有任何 URL。
        ( cd third_party/relkit && go build -o "$OLDPWD/relkit-bin" ./cmd/relkit )
        ./relkit-bin stage "$VERSION" --channel "$CHANNEL" \
          --add "dist/cronkit-${VERSION}-win-x64.zip" os=windows,arch=x64

    - name: publish
      script: |
        set -euo pipefail
        VERSION=$(cat .release-version)
        CHANNEL=$(cat .release-channel)
        if [ -z "${RELKIT_PUBLISH_TOKEN:-}" ]; then
          echo "RELKIT_PUBLISH_TOKEN 未配置，无法发布"
          exit 1
        fi
        PUBLISH_URL="${RELKIT_PUBLISH_URL:-https://publish.firoyang.com}"

        tar -C ".relkit/staged/${VERSION}" -czf staged.tar.gz .
        SHA=$(sha256sum staged.tar.gz | awk '{print $1}')

        # 版本号含 `+`，在 URL path 段里必须转义，否则被解成空格。
        VER_PATH=$(printf '%s' "$VERSION" | sed 's/+/%2B/g')

        curl -fsS -X PUT \
          -H "Authorization: Bearer ${RELKIT_PUBLISH_TOKEN}" \
          --data-binary @staged.tar.gz \
          "${PUBLISH_URL}/v1/staged/cronkit/${VER_PATH}"

        # 签名与上传 COS 都发生在发布机上，CI 只是把 staged 交过去并请求提交。
        curl -fsS -X POST \
          -H "Authorization: Bearer ${RELKIT_PUBLISH_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"product\":\"cronkit\",\"version\":\"${VERSION}\",\"stagedSha256\":\"${SHA}\",\"idempotencyKey\":\"cronkit/${CHANNEL}/${VERSION}/${SHA}\"}" \
          "${PUBLISH_URL}/v1/publish"

        echo "published cronkit ${VERSION} → ${CHANNEL}"

"beta/*":
  tag_push:
    - <<: *release
      name: release-beta

"stable/*":
  tag_push:
    - <<: *release
      name: release-stable

# 主干持续验证。发布路径长期没人走就会腐烂，而一旦 CI 构建不出来，"先在本地打一个"
# 就重新变成唯一选择 —— 这正是绕过发布流程的起点。这个 job 不导入任何密钥。
main:
  push:
    - name: verify
      docker:
        image: electronuserland/builder:wine
      env:
        GO_VERSION: "1.26.3"
      stages:
        - name: toolchain
          script: *toolchain-script
        - name: deps
          script: *deps-script
        - name: checks
          script: *checks-script
        - name: build
          script: *build-script
