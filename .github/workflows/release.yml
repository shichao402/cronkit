# cronkit 按 relkit 渠道 tag 发版：
#   git tag  beta/vX.Y.Z+N   && git push origin  beta/vX.Y.Z+N    → RUP channel=beta
#   git tag  stable/vX.Y.Z+N && git push origin  stable/vX.Y.Z+N  → RUP channel=stable
# 推送前请先把 VERSION.json 改成对应版本并推到 main。
# 密钥（仓库 Secrets）：
#   RELKIT_UPLOAD_TOKEN（cronkit 专属上传凭据，必填）
#   RELKIT_AGENT_URL（可选，可写站点根或 /v1，默认 https://publish.firoyang.com/v1）
# 手动触发：Actions → Release → Run workflow（按 VERSION.json，默认 channel=beta）

name: Release

on:
  push:
    tags:
      - "beta/v*"
      - "stable/v*"
  workflow_dispatch:
    inputs:
      channel:
        description: RUP channel when not triggered by a channel tag
        type: choice
        options:
          - beta
          - stable
        default: beta

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    env:
      RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}
      RELKIT_AGENT_URL: ${{ secrets.RELKIT_AGENT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          # No go.sum in this repo; the default cache lookup only annotates.
          cache: false

      - name: Resolve version and channel
        id: meta
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'beta' }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          case "$TAG" in
            beta/v*)
              CHANNEL=beta
              VERSION="${TAG#beta/v}"
              ;;
            stable/v*)
              CHANNEL=stable
              VERSION="${TAG#stable/v}"
              ;;
            *)
              CHANNEL="${RELEASE_CHANNEL:-beta}"
              VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).version)")
              echo "非渠道 tag 触发（ref=$TAG），使用 VERSION.json=$VERSION channel=$CHANNEL"
              ;;
          esac

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "无效版本号：$VERSION（期望 x.y.z+build）"
            exit 1
          fi
          if [ "$CHANNEL" != "beta" ] && [ "$CHANNEL" != "stable" ]; then
            echo "无效渠道：$CHANNEL"
            exit 1
          fi

          FILE_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).version)")
          if [ "$FILE_VER" != "$VERSION" ]; then
            echo "VERSION.json（$FILE_VER）与发布版本（$VERSION）不一致"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION channel=$CHANNEL tag=$TAG"

      - name: Relkit SDK + deps
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ensure-relkit.mjs
          npm ci

      - name: Checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check-version
          npx tsc --noEmit
          npm test

      - name: Dist
        shell: bash
        run: |
          set -euo pipefail
          npm run dist
          ls -l dist/

      - name: Stage and publish
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          RELKIT_UPLOAD_PART_SIZE: ${{ vars.RELKIT_UPLOAD_PART_SIZE }}
          RELKIT_UPLOAD_CONCURRENCY: ${{ vars.RELKIT_UPLOAD_CONCURRENCY }}
        run: |
          set -euo pipefail
          if [ -z "${RELKIT_UPLOAD_TOKEN:-}" ]; then
            echo "RELKIT_UPLOAD_TOKEN 未配置，无法发布"
            exit 1
          fi

          ( cd third_party/relkit && go build -o "$OLDPWD/relkit-cli" ./cmd/relkit )
          CLI=./relkit-cli
          if [ -f ./relkit-cli.exe ]; then
            CLI=./relkit-cli.exe
          fi
          ZIP="dist/cronkit-${VERSION}-win-x64.zip"
          if [ ! -f "$ZIP" ]; then
            echo "缺少产物 $ZIP"
            ls -l dist/ || true
            exit 1
          fi
          "$CLI" stage "$VERSION" --channel "$CHANNEL" \
            --add "$ZIP" os=windows,arch=x64

          AGENT_URL="${RELKIT_AGENT_URL:-https://publish.firoyang.com/v1}"
          AGENT_URL="${AGENT_URL%/}"
          case "$AGENT_URL" in
            */v1) ;;
            *) AGENT_URL="${AGENT_URL}/v1" ;;
          esac

          tar -C ".relkit/staged/${VERSION}" -czf staged.tar.gz .
          SHA=$(sha256sum staged.tar.gz | awk '{print $1}')
          "$CLI" staged-put staged.tar.gz \
            --product cronkit \
            --version "$VERSION" \
            --url "$AGENT_URL"

          agent_curl() {
            local method="$1" url="$2"
            shift 2
            local body code
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w "%{http_code}" -X "$method" \
              -H "Authorization: Bearer ${RELKIT_UPLOAD_TOKEN}" \
              "$@" \
              "$url")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "agent ${method} ${url} HTTP ${code}: $(head -c 800 "$body")"
              rm -f "$body"
              return 1
            fi
            cat "$body"
            rm -f "$body"
          }

          agent_curl POST "${AGENT_URL}/publish" \
            -H "Content-Type: application/json" \
            -d "{\"product\":\"cronkit\",\"version\":\"${VERSION}\",\"stagedSha256\":\"${SHA}\",\"idempotencyKey\":\"cronkit/${CHANNEL}/${VERSION}/${SHA}\"}"

          echo "published cronkit ${VERSION} → ${CHANNEL}"
