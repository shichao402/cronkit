# cronkit 按 relkit 渠道 tag 发版：
#   git tag  beta/vX.Y.Z+N   && git push origin  beta/vX.Y.Z+N    → RUP channel=beta
#   git tag  stable/vX.Y.Z+N && git push origin  stable/vX.Y.Z+N  → RUP channel=stable
# 推送前请先把 VERSION.json 改成对应版本并推到 main。
# 密钥（仓库 Secrets）：
#   RELKIT_UPLOAD_TOKEN（cronkit 专属上传凭据，必填）
# 手动触发：Actions → Release → Run workflow（按 VERSION.json，默认 channel=beta）

name: Release

on:
  push:
    tags:
      - "beta/v*"
      - "stable/v*"
  workflow_dispatch:
    inputs:
      channel:
        description: RUP channel when not triggered by a channel tag
        type: choice
        options:
          - beta
          - stable
        default: beta

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    env:
      RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}
      RELKIT_RELEASE_VIA_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: false

      - name: Resolve version and channel
        id: meta
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'beta' }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          case "$TAG" in
            beta/v*)
              CHANNEL=beta
              VERSION="${TAG#beta/v}"
              ;;
            stable/v*)
              CHANNEL=stable
              VERSION="${TAG#stable/v}"
              ;;
            *)
              CHANNEL="${RELEASE_CHANNEL:-beta}"
              VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).version)")
              echo "非渠道 tag 触发（ref=$TAG），使用 VERSION.json=$VERSION channel=$CHANNEL"
              ;;
          esac

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "无效版本号：$VERSION（期望 x.y.z+build）"
            exit 1
          fi
          if [ "$CHANNEL" != "beta" ] && [ "$CHANNEL" != "stable" ]; then
            echo "无效渠道：$CHANNEL"
            exit 1
          fi

          FILE_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).version)")
          if [ "$FILE_VER" != "$VERSION" ]; then
            echo "VERSION.json（$FILE_VER）与发布版本（$VERSION）不一致"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION channel=$CHANNEL tag=$TAG"

      - name: Relkit lock + deps
        shell: bash
        run: |
          set -euo pipefail
          python scripts/host/relkit_host.py install
          npm ci

      - name: Checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check-version
          npx tsc --noEmit
          npm test

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Dist
        shell: bash
        run: |
          set -euo pipefail
          npm run dist
          ls -l dist/

      - name: Stage and publish
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${RELKIT_UPLOAD_TOKEN:-}" ]; then
            echo "RELKIT_UPLOAD_TOKEN 未配置，无法发布"
            exit 1
          fi
          CLI=./tools/bin/relkit.exe
          ZIP="dist/cronkit-${VERSION}-win-x64.zip"
          SETUP="dist/cronkit-${VERSION}-win-x64-setup.exe"
          PAYLOAD=".release/versioned/versions/${VERSION}"
          if [ ! -f "$ZIP" ]; then
            echo "缺少产物 $ZIP"
            ls -l dist/ || true
            exit 1
          fi
          if [ ! -f "$SETUP" ]; then
            echo "缺少产物 $SETUP"
            ls -l dist/ || true
            exit 1
          fi
          if [ ! -d "$PAYLOAD" ]; then
            echo "缺少内部更新轨输入树 $PAYLOAD"
            ls -l .release/versioned/versions/ || true
            exit 1
          fi
          # payload 的 selectors 必须与同组完整安装包逐字一致（apply 键由 relkit 注入），
          # 否则只发 payload 会被 stage 拒绝，而客户端只会拿到 FULL_INSTALL。
          "$CLI" stage "$VERSION" --channel "$CHANNEL" \
            --install "$ZIP" os=windows,arch=x64 \
            --install "$SETUP" os=windows,arch=x64,audience=user \
            --payload "$PAYLOAD" os=windows,arch=x64
          python scripts/host/relkit_host.py release --execute
          echo "published cronkit ${VERSION} → ${CHANNEL}"
