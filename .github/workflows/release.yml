# cronkit 按 relkit 渠道 tag 发版：
#   git tag  dev/vX.Y.Z+N    && git push origin  dev/vX.Y.Z+N     → RUP channel=dev
#   git tag  stable/vX.Y.Z+N && git push origin  stable/vX.Y.Z+N  → RUP channel=stable
# 推送前请先把 VERSION.json 改成对应版本并推到 main。
# 密钥（仓库 Secrets）：
#   RELKIT_UPLOAD_TOKEN（cronkit 专属上传凭据，必填）
#   RELKIT_AGENT_URL（agent 地址，可写站点根或 /v1；默认 https://publish.firoyang.com/v1）
# 手动触发：Actions → Release → Run workflow（按 VERSION.json，默认 channel=dev）
#
# 2026-09-28 起（ADR 0017 阶段 2b）：CI 入口与发布尾段全部走 relkit Go CLI
# （`go run github.com/shichao402/relkit/cmd/relkit@$RELKIT_REF`，舰队统一版本），
# （scripts/host）已整体退役。编组（package-release.mjs 产出 dist/release-artifacts.json
# /2 结构化 selectorGroups）+ stage + simulate + fake verify + cas-put + POST /publish 全在
# `relkit ci release --execute` 进程内完成。

name: Release

on:
  push:
    tags:
      - "dev/v*"
      - "stable/v*"
  workflow_dispatch:
    inputs:
      channel:
        description: RUP channel when not triggered by a channel tag
        type: choice
        options:
          - dev
          - stable
        default: dev
      allow_backfill:
        description: Deliberately backfill a historical version (--allow-backfill)
        type: boolean
        default: false

# 全局串行（2026-10-06 stable 三连发实证改）：per-ref 分组会让不同 tag
# 真并行跑，完成顺序随机（+29 先注册、+28 后到被时序门禁拒绝）。改为与
# Dec 同形态的全局单组：同仓发版严格先来后到，一次只跑一个，后面排队
# 等待（cancel-in-progress: false 不打断跑着的）。代价是连发时总耗时
# 叠加，属可接受；GitHub pending 单槽丢中间车是平台硬规则，触发端控制
# 节奏（上一发完成再推下一发）可完全规避。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# relkit 舰队统一版本（P1 原则）：全 workflow 单一版本引用，re-pin 只改这一行。
# lock 是 follow-latest 形态（P4）：此值只表达 bootstrap floor——认识
# latest 形态的最低 CLI 版本，跟随目标由解析链给出（lock 声明 latest）。
env:
  RELKIT_REF: v0.5.20

jobs:
  release:
    runs-on: windows-latest
    env:
      RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}
      RELKIT_AGENT_URL: ${{ secrets.RELKIT_AGENT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: false

      - name: Resolve version and channel
        id: meta
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'dev' }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          case "$TAG" in
            dev/v*)
              CHANNEL=dev
              VERSION="${TAG#dev/v}"
              ;;
            stable/v*)
              CHANNEL=stable
              VERSION="${TAG#stable/v}"
              ;;
            *)
              CHANNEL="${RELEASE_CHANNEL:-dev}"
              VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).version)")
              echo "非渠道 tag 触发（ref=$TAG），使用 VERSION.json=$VERSION channel=$CHANNEL"
              ;;
          esac

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "无效版本号：$VERSION（期望 x.y.z+build）"
            exit 1
          fi
          if [ "$CHANNEL" != "dev" ] && [ "$CHANNEL" != "stable" ]; then
            echo "无效渠道：$CHANNEL"
            exit 1
          fi

          FILE_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('VERSION.json','utf8')).version)")
          if [ "$FILE_VER" != "$VERSION" ]; then
            echo "VERSION.json（$FILE_VER）与发布版本（$VERSION）不一致"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION channel=$CHANNEL tag=$TAG"

      - name: Relkit lock + deps
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/shichao402/relkit/cmd/relkit@$RELKIT_REF install
          npm ci

      - name: Checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check-version
          npx tsc --noEmit
          npm test

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Pack, verify, and publish
        shell: bash
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          RELKIT_RELEASE_VIA_CI: "1"
          RELKIT_PYTHON: python3
        run: |
          set -euo pipefail
          if [ -z "${RELKIT_UPLOAD_TOKEN:-}" ]; then
            echo "RELKIT_UPLOAD_TOKEN 未配置，无法发布"
            exit 1
          fi
          BACKFILL_ARGS=""
          if [ "${{ github.event.inputs.allow_backfill }}" = "true" ]; then
            BACKFILL_ARGS="--allow-backfill"
            echo "allow_backfill=true：本次为刻意补发历史版本"
          fi
          go run github.com/shichao402/relkit/cmd/relkit@$RELKIT_REF ci release --channel "$CHANNEL" --execute $BACKFILL_ARGS
          echo "published cronkit ${{ steps.meta.outputs.version }} → ${CHANNEL}"
