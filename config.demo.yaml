# 本机可跑通的演示配置。路径相对本文件。
version: 2
timezone: Asia/Shanghai

runtime:
  maxConcurrentRuns: 1
  catchUpPreviousDays: 0
  retryFailedOnCatchUp: false

tasks:
  - id: after-midnight
    name: 每天凌晨后的例行更新与预热
    trigger:
      type: cron
      cron: "10 2 * * *"
    targets:
      - id: trunk-client
        name: 主干客户端（演示）
        path: fixtures/wc
        steps:
          - uses: builtin/svn-update
            with:
              strategy: follow-latest
              onConflict: revert
            timeout: 2h
            retry: 1
          - uses: builtin/unity-warmup
            with:
              nographics: false
            timeout: 90m
            retry: 1
            continueOnError: false
      - id: tools-scripts
        name: 工具脚本仓（演示）
        path: fixtures/tools-wc
        steps:
          - uses: builtin/svn-update
            with:
              strategy: follow-latest
            timeout: 30m
          - uses: builtin/script
            with:
              command: powershell
              args:
                - "-NoProfile"
                - "-File"
                - "scripts/nightly-check.ps1"
            timeout: 15m
            continueOnError: true

  - id: rider-idle-watch
    name: 0 点起算，空闲满 1 小时后正常退出 Rider
    trigger:
      type: cron
      cron: "*/15 0-7 * * *"
    targets:
      - id: rider-idle-quit
        name: Rider 空闲退出（演示）
        path: fixtures/wc
        oncePerDay: false
        steps:
          - uses: builtin/quit-idle
            with:
              processNames:
                - rider64
                - rider
              idleFor: 1h
              countIdleFrom: "00:00"
              until: "08:00"
            timeout: 3m

  - id: manual-release-1.0
    name: 发布分支（演示，仅手动）
    trigger:
      type: manual
    targets:
      - id: release-1.0
        name: 发布分支（演示，仅手动）
        path: fixtures/wc
        steps:
          - uses: builtin/svn-update
            with:
              strategy: manual
            timeout: 2h
          - uses: builtin/unity-warmup
            with:
              nographics: false
            timeout: 90m

  - id: manual-osg-build-example
    name: OSG 构建示例（需先安装 osg toolset）
    trigger:
      type: manual
    targets:
      - id: osg-build-example
        name: OSG 构建示例（需先安装 osg toolset）
        path: fixtures/wc
        steps:
          - uses: builtin/svn-update
            with:
              strategy: follow-latest
              onConflict: revert
            timeout: 2h
          - uses: builtin/script
            with:
              command: powershell
              args: ["-NoProfile", "-Command", "Write-Host osg-build-example placeholder"]
            timeout: 1m

  - id: manual-git-repo-example
    name: Git 仓库（演示）
    trigger:
      type: manual
    targets:
      - id: git-repo-example
        name: Git 仓库（演示）
        path: fixtures/git-wc
        steps:
          - uses: builtin/git-status
            timeout: 1m
          - uses: builtin/git-pull
            with:
              strategy: follow-latest
              ffOnly: true
            timeout: 15m
            retry: 1

reporting:
  enabled: false
  adapter: wechat-bot
  endpointEnv: WECHAT_BOT_ENDPOINT
  on:
    - run-finished
    - daily-summary

brain:
  enabled: false
  provider: codebuddy
  model: claude-4.5
  maxTurns: 8
  permissionMode: default
  allowedTools:
    - Read
    - Grep
    - Glob
  allowedCommands:
    - runWorkspace
    - runTarget
    - cancelRun
    - summarizeDay
  requireConfirmationFor:
    - runWorkspace
    - runTarget
    - cancelRun
